<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITULO da pagina -->
    <title>Cadastro de Produto | FF Studio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="icon" type="image/png" href="../images/Logo_FFStudio_2.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../styles/style.css">
</head>

<body class="bg-[#FDF8F3] min-h-screen">

    <!-- Navegação simplificada para a área administrativa -->
    <nav class="bg-white shadow-sm border-b border-orange-100">
        <div class="max-w-7xl mx-auto px-4 py-5 flex justify-between items-center">

            <a href="index.html" class="flex items-center">
                <img src="../images/Logo_FFStudio.png" alt="Logo FF Studio" class="h-10 w-auto">
            </a>

            <button onclick="history.back()"
                class="border border-coral text-coral px-5 py-2 rounded-full hover:bg-coral hover:text-white transition flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Voltar
            </button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="max-w-3xl mx-auto px-4 py-16">

        <div class="mb-10 text-center">
            <p class="text-coral font-medium tracking-widest uppercase mb-4 text-sm">Painel Administrativo</p>
            <h1 class="text-4xl lg:text-5xl font-bold text-gray-800">
                Cadastrar novo produto
            </h1>
        </div>

        <div class="bg-white rounded-3xl shadow-lg p-8 lg:p-12">

            <form id="product-form" class="space-y-6">

                <!-- Nome do Produto -->
                <div>
                    <label for="name" class="block text-sm font-bold text-gray-700 mb-2">Nome da Peça</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all"
                        placeholder="Ex: Bolsa Elegance">
                </div>

                <!-- Descrição -->
                <div>
                    <label for="description" class="block text-sm font-bold text-gray-700 mb-2">Descrição
                        Detalhada</label>
                    <textarea id="description" name="description" rows="4" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all resize-none"
                        placeholder="Descreva os materiais, o estilo e os detalhes da peça..."></textarea>
                </div>

                <!-- Preço Base -->
                <div>
                    <label for="base_price" class="block text-sm font-bold text-gray-700 mb-2">Preço (R$)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-medium">R$</span>
                        </div>
                        <input type="number" id="base_price" name="base_price" step="0.01" min="0" required
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all"
                            placeholder="0,00">
                    </div>
                </div>

                <!-- URL da Imagem -->
                <div>
                    <label for="image_file" class="block text-sm font-bold text-gray-700 mb-2">Foto da Peça</label>

                    <!-- Mudamos o type para file e aceitamos apenas imagens -->
                    <input type="file" id="image_file" name="image_file" accept="image/*" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-coral focus:border-transparent transition-all bg-white">

                    <p class="text-xs text-gray-500 mt-2">Selecione uma foto do seu computador (JPG, PNG).</p>
                </div>

                <!-- Botões de Ação -->
                <div class="pt-6 flex gap-4">
                    <button type="button" onclick="document.getElementById('product-form').reset()"
                        class="w-1/3 bg-gray-100 text-gray-700 px-6 py-4 rounded-full font-medium hover:bg-gray-200 transition">
                        Limpar
                    </button>

                    <button type="submit"
                        class="w-2/3 bg-green text-white px-6 py-4 rounded-full font-medium hover:opacity-90 transition btn-hover flex justify-center items-center gap-2">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        Salvar Produto
                    </button>
                </div>

            </form>
        </div>

    </main>

    <!-- Inicialização dos Ícones -->
    <script>
        lucide.createIcons();
    </script>

    <script type="module" src="../javascript/pageFunctions/cadastroProd.js"></script>

</body>

</html>
